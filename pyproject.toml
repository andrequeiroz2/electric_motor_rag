[project]
name = "eletric-motor"
version = "0.1.0"
description = "RAG de motores elétricos"
readme = "README.md"
authors = [
    { name = "andrequeiroz2", email = "andrequeiroz.com@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.132.0",
    "fastembed>=0.8.1",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.1.3",
    "langdetect>=1.0.9",
    "onnxruntime>=1.22,<1.23 ; python_full_version < '3.14'",
    "pydantic>=2",
    "pydantic-settings>=2",
    "qdrant-client>=1.15",
    "tiktoken>=0.14.0",
]

[project.scripts]
eletric-motor = "eletric_motor:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
